# Somente DEV: sobe edge-server e web-server com hot reload.
#   docker compose up --build
# Em prod o web-server vai pra Vercel e o edge roda direto no Raspberry Pi.
name: press2replay

services:
  edge-server:
    build:
      context: ./edge-server
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"   # API HTTP (/health, /status, /replay)
      - "1935:1935"   # RTMP (INGEST_MODE=rtmp)
    env_file:
      - path: ./edge-server/.env
        required: false
    volumes:
      - ./edge-server:/app
      - edge-node-modules:/app/node_modules   # nao deixa o bind mount sobrescrever as deps do container

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: press2replay
      POSTGRES_PASSWORD: press2replay   # so dev; em prod o banco e o da Vercel
      POSTGRES_DB: press2replay
    ports:
      - "5432:5432"   # pra rodar drizzle-kit/studio do host
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U press2replay -d press2replay"]
      interval: 3s
      timeout: 3s
      retries: 10

  web-server:
    build:
      context: ./web-server
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"   # 3000 do host ja e do edge-server
    env_file:
      - path: ./web-server/.env
        required: false
    environment:
      WATCHPACK_POLLING: "true"   # file watching confiavel em bind mount no Mac
      DATABASE_URL: postgres://press2replay:press2replay@postgres:5432/press2replay
      BETTER_AUTH_SECRET: dev-only-secret-change-me-0123456789abcdef   # so dev
      BETTER_AUTH_URL: http://localhost:3001   # porta do host
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./web-server:/app
      - web-node-modules:/app/node_modules
      - web-next-cache:/app/.next

volumes:
  postgres-data:
  edge-node-modules:
  web-node-modules:
  web-next-cache:
